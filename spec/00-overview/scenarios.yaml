- id: SCEN-GROUP-01
  title: "Group messaging"
  success_criteria:
    - SC-MSG-02
  requirements:
    - REQ-MSG-012
    - REQ-MSG-065
  tests:
    - TEST-GROUP-01
  topology: [alice, bob, carol]
  steps:
    - id: S1
      action: group.create
      actor: alice
      params: { group_id: "group-1", members: [bob, carol] }
    - id: S2
      action: group.send_message
      actor: alice
      params: { group_id: "group-1", body: "hello group" }
    - id: S3
      action: assert.group_message_received
      actor: bob
      params: { group_id: "group-1", from: alice, body: "hello group" }

- id: SCEN-KEY-ROTATION-01
