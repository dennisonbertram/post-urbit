      actor: alice
      params: { app: "example.postapp" }
    - id: S2
      action: assert.app_installed
      actor: alice
      params: { app: "example" }

- id: SCEN-JOURNEY-06
  title: "Sync app data to a second node"
  success_criteria:
    - SC-JOURNEY-06
    - SC-SYNC-01
    - SC-SYNC-02
    - SC-SYNC-03
  requirements:
    - REQ-SYNC-007
    - REQ-SYNC-008
  tests:
    - TEST-JOURNEY-06
  topology: [alice, bob]
  steps:
    - id: S1
      action: node.create_identity
      actor: alice
    - id: S2
      action: node.create_identity
      actor: bob
