# Scenario Catalog (initial scaffold)
# Each scenario maps to SC-* and (eventually) REQ-* IDs.

- id: SCEN-JOURNEY-01
  title: "Install a node and reach admin UI"
  success_criteria:
    - SC-JOURNEY-01
    - SC-NODE-01
  requirements:
    - REQ-OPS-017
  tests:
    - TEST-JOURNEY-01
  topology: [alice]
  steps:
    - id: S1
      action: node.install
      actor: alice
    - id: S2
      action: assert.admin_ui_reachable
      actor: alice

- id: SCEN-NODE-01
  title: "Local storage and backup/restore"
  success_criteria:
    - SC-NODE-02
    - SC-NODE-03
  requirements:
    - REQ-OPS-016
  tests:
    - TEST-NODE-01
  topology: [alice]
  steps:
    - id: S1
      action: node.write_data
      actor: alice
      params: { key: "k1", value: "v1" }
    - id: S2
      action: node.backup
      actor: alice
      params: { backup_id: "backup-1" }
    - id: S3
      action: node.restore
      actor: alice
      params: { backup_id: "backup-1" }
    - id: S4
      action: assert.data_restored
      actor: alice
      params: { key: "k1", value: "v1" }

- id: SCEN-JOURNEY-02
  title: "Claim an identity"
  success_criteria:
    - SC-JOURNEY-02
    - SC-ID-01
    - SC-ID-02
  requirements:
    - REQ-IDOC-003
    - REQ-IDOC-017
  tests:
    - TEST-JOURNEY-02
  topology: [alice]
  steps:
    - id: S1
      action: node.create_identity
      actor: alice
    - id: S2
      action: assert.identity_exists
      actor: alice

- id: SCEN-JOURNEY-03
  title: "Add a contact"
  success_criteria:
    - SC-JOURNEY-03
    - SC-CONN-01
    - SC-ID-03
  requirements:
    - REQ-ID-004
    - REQ-SHARED-013
  tests:
    - TEST-JOURNEY-03
  topology: [alice, bob]
  steps:
    - id: S1
      action: node.create_identity
      actor: alice
    - id: S2
      action: node.create_identity
      actor: bob
    - id: S3
      action: node.exchange_identity
      actor: alice
      params: { target: bob }
    - id: S4
      action: assert.contact_added
      actor: alice
      params: { target: bob }

- id: SCEN-JOURNEY-04
  title: "Message across NAT with relay fallback"
  success_criteria:
    - SC-JOURNEY-04
    - SC-CONN-02
    - SC-CONN-03
    - SC-MSG-01
  requirements:
    - REQ-TRANS-007
    - REQ-TRANS-066
    - REQ-MSG-039
  tests:
    - TEST-JOURNEY-04
  topology: [alice, bob, relay]
  steps:
    - id: S1
      action: node.create_identity
      actor: alice
    - id: S2
      action: node.create_identity
      actor: bob
    - id: S3
      action: network.set_nat
      params: { bob: "symmetric_nat" }
    - id: S4
      action: node.add_contact
      actor: alice
      params: { target: bob }
    - id: S5
      action: node.send_message
      actor: alice
      params: { to: bob, body: "hello" }
    - id: S6
      action: assert.message_received
      actor: bob
      params: { from: alice, body: "hello" }
    - id: S7
      action: assert.delivery_path
      actor: bob
      params: { via: "relay" }

- id: SCEN-JOURNEY-05
  title: "Install an app"
  success_criteria:
    - SC-JOURNEY-05
    - SC-APP-01
    - SC-APP-02
  requirements:
    - REQ-APP-034
    - REQ-OPS-002
  tests:
    - TEST-JOURNEY-05
  topology: [alice]
  steps:
    - id: S1
