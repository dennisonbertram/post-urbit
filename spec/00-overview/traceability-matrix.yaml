  description: In Post-Urbit v1, implementations MUST NOT send application-layer data (control stream messages, identity handshake, or any stream data) in QUIC 0-RTT early data. The `tls_binding` required for identity handshake is only available after TLS 1.3 handshake completion, making 0-RTT impossible for authenticated streams.
